; Survival Adrenaline settings.
;
; While you're in a dungeon or in combat, hunger and fatigue build up at these
; fractions of their normal speed (0.15 = 15% of normal speed). What you didn't gain is
; held back and lands all at once when the adrenaline ends: when you're out of
; combat AND out of any dungeon.
;
; Values from 0.05 to 1.0. Lower = stronger adrenaline, bigger crash.
; In combat inside a dungeon, the lower of the two values is used.

[General]
fHungerMultInDungeon = 0.15
fFatigueMultInDungeon = 0.15
fHungerMultInCombat = 0.15
fFatigueMultInCombat = 0.15

; Everything held back while inside a dungeon lands this many times harder
; at the crash (1.25 = 25% extra). What was held back in combat outside a
; dungeon always lands as is.
fDungeonCrashMult = 1.25

; Show a message when the crash hits (1 = yes, 0 = no).
bCrashMessage = 1

; How often, in real seconds, the mod checks whether you're in a dungeon or combat.
fCheckIntervalSeconds = 1.0
